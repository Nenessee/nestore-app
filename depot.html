<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestore — Espace dépôt</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<link rel="stylesheet" href="nestore-ui.css">
<style>
  .page { max-width: 760px; margin: 0 auto; padding: 14px 16px 60px; display: flex; flex-direction: column; gap: 12px; }
  .centre { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .thumb-ph { display: grid; place-items: center; font-size: 18px; color: var(--n-ink-4); }
  .ligne-active { cursor: pointer; }
  .ligne-active:active { background: var(--n-surface-2); }
  /* Panneau d'actions (clic sur un article) — feuille qui monte du bas, façon onglet Vinted. */
  .voile { position: fixed; inset: 0; z-index: 50; background: rgba(10,10,10,.45); display: none; }
  .voile.on { display: block; }
  .feuille { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(520px, 100vw);
    background: var(--n-surface); border: 1px solid var(--n-line); border-radius: 18px 18px 0 0;
    max-height: 82dvh; overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (max-width: 480px) { .masq-mobile { display: none; } }
</style>
</head>
<body class="n-app">

<!-- ===== Connexion ===== -->
<div id="ecranLogin" class="centre">
  <div class="n-card" style="width:min(380px,94vw);"><div class="n-card__body" style="padding:26px 22px;">
    <div class="n-h2" style="font-size:20px;">Nestore — Espace dépôt</div>
    <div class="n-muted" style="font-size:13px;margin:4px 0 18px;">Suis tes articles en dépôt chez Nestore.</div>
    <span class="n-label">Nom du compte</span>
    <input id="logNom" class="n-field" style="margin:6px 0 14px;" autocomplete="username" placeholder="Ton nom de compte">
    <span class="n-label">Code</span>
    <input id="logPin" class="n-field n-num" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" style="margin:6px 0 16px;letter-spacing:4px;text-align:center;" onkeydown="if(event.key==='Enter')seConnecter()">
    <button class="n-btn n-btn--primary" style="width:100%;" onclick="seConnecter()">Se connecter</button>
    <div id="logErr" style="color:var(--n-bad);font-size:13px;margin-top:12px;text-align:center;min-height:18px;"></div>
  </div></div>
</div>

<!-- ===== Espace ===== -->
<div id="ecranEspace" style="display:none;">
  <div class="n-topbar">
    <div><div class="n-h3">Nestore</div><div class="n-label" style="letter-spacing:1.2px;">Espace dépôt</div></div>
    <div style="margin-left:auto;display:flex;gap:6px;align-items:center;">
      <span class="n-pill n-pill--accent n-pill--dot" id="pillNom"></span>
      <button class="n-btn n-btn--ghost n-btn--sm" onclick="chargerTout()">↻</button>
      <button class="n-btn n-btn--ghost n-btn--sm" onclick="seDeconnecter()">Quitter</button>
    </div>
  </div>

  <div class="page">
    <div class="kpis" id="kpis"></div>
    <div class="n-muted" style="font-size:11.5px;" id="regles"></div>

    <div class="n-card">
      <div class="n-card__head"><span class="n-label">Tes articles en ligne</span><span class="n-muted n-num" id="cptEnLigne" style="font-size:11.5px;"></span></div>
      <div class="n-card__body n-card__body--flush" id="listeEnLigne"><div style="padding:22px;text-align:center;color:var(--n-ink-3);font-size:13px;">Chargement…</div></div>
    </div>

    <div class="n-card">
      <div class="n-card__head"><span class="n-label">Vendus ou retirés</span><span class="n-muted n-num" id="cptSortis" style="font-size:11.5px;"></span></div>
      <div class="n-card__body n-card__body--flush" id="listeSortis"></div>
    </div>

    <div class="n-card">
      <div class="n-card__head"><span class="n-label">Tes demandes</span></div>
      <div class="n-card__body n-card__body--flush" id="listeDemandes"></div>
    </div>

  </div>
</div>

<!-- Panneau d'actions sur un article -->
<div class="voile" id="voile" onclick="if(event.target===this)fermerPanneau()">
  <div class="feuille" id="feuille"></div>
</div>

<script>
const BACKEND_URL = 'https://nestore-stock-server-production.up.railway.app';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const eur = n => (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
let jeton = null; try { jeton = localStorage.getItem('nv_depot_token'); } catch(_){}
let donnees = null;
let articleOuvert = null; // article affiché dans le panneau d'actions

async function api(chemin, options){
  const o = options || {};
  o.headers = Object.assign({ 'X-NV-Token': jeton || '' }, o.headers || {});
  const r = await fetch(BACKEND_URL + chemin, o);
  if (r.status === 401) { seDeconnecter(); throw new Error('Session expirée — reconnecte-toi'); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

async function seConnecter(){
  const nom = document.getElementById('logNom').value.trim();
  const pin = document.getElementById('logPin').value;
  const err = document.getElementById('logErr');
  if (!nom || !pin) { err.textContent = 'Nom et code requis.'; return; }
  err.textContent = '';
  try {
    const r = await fetch(BACKEND_URL + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: nom, pin }) });
    const d = await r.json().catch(()=>({}));
    if (!r.ok) { err.textContent = d.error || 'Échec de connexion'; return; }
    if (!d.depot_tag) { err.textContent = 'Ce compte n\'a pas d\'espace dépôt — contacte Nestore.'; return; }
    jeton = d.token; try { localStorage.setItem('nv_depot_token', jeton); } catch(_){}
    document.getElementById('pillNom').textContent = d.name;
    montrerEspace();
  } catch(_) { err.textContent = 'Erreur réseau — réessaie.'; }
}
function seDeconnecter(){
  const t = jeton; jeton = null;
  try { localStorage.removeItem('nv_depot_token'); } catch(_){}
  if (t) fetch(BACKEND_URL + '/auth/logout', { method:'POST', headers:{'X-NV-Token':t,'Content-Type':'application/json'}, body:'{}' }).catch(()=>{});
  document.getElementById('ecranEspace').style.display = 'none';
  document.getElementById('ecranLogin').style.display = 'flex';
}
function montrerEspace(){
  document.getElementById('ecranLogin').style.display = 'none';
  document.getElementById('ecranEspace').style.display = 'block';
  chargerTout();
}

async function chargerTout(){
  fermerPanneau();
  try {
    const d = await api('/depot/mine');
    donnees = d;
    const c = d.commission;
    document.getElementById('regles').textContent =
      `Quand un article se vend, tu touches son prix − ${Math.round(c.taux*100)} % − ${c.frais} € de frais fixes. Les prix sont en multiples de 5 € (minimum ${c.prixMin} €). Tes demandes (retrait, prix…) sont appliquées après validation par l'équipe.`;
    const k = (val,lbl)=>`<div class="n-card n-kpi"><span class="n-label">${lbl}</span><div class="n-kpi__val" style="font-size:20px;">${val}</div></div>`;
    document.getElementById('kpis').innerHTML =
      k(d.totaux.enLigne,'Articles en ligne') +
      k(eur(d.totaux.valeurEnLigne),'Valeur affichée') +
      k(eur(d.totaux.netSiToutVendu),'Ton net si tout se vend') +
      k(d.totaux.sortis,'Vendus / retirés');
    const enLigne = d.items.filter(i=>i.enLigne);
    const sortis = d.items.filter(i=>!i.enLigne);
    document.getElementById('cptEnLigne').textContent = enLigne.length + ' article' + (enLigne.length>1?'s':'');
    document.getElementById('cptSortis').textContent = sortis.length + ' article' + (sortis.length>1?'s':'');
    const ligne = (i, actif) => `
      <div class="n-row${actif?' ligne-active':''}"${actif?` onclick="ouvrirPanneau(event,'${esc(i.productId)}')"`:''}>
        ${i.image?`<img class="n-row__thumb" src="${esc(i.image)}" alt="">`:`<div class="n-row__thumb thumb-ph">👕</div>`}
        <div class="n-row__main">
          <div class="n-row__title">${esc(i.titre)}</div>
          <div class="n-row__sub">${i.barcode?esc(i.barcode)+' · ':''}${i.net!=null?('ton net : '+eur(i.net)):''}${i.url?` · <a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;white-space:nowrap;">voir sur le site ↗</a>`:''}</div>
        </div>
        <div class="n-row__side">
          ${i.demandes.length?`<span class="n-pill n-pill--accent">⏳ ${i.demandes.map(x=>x.type==='prix'?('prix '+x.newPrice+' €'):x.type.replace('_',' ')).join(' · ')}</span>`:(actif?'<span class="n-pill n-pill--outline">En ligne</span>':'<span class="n-pill n-pill--solid">Sorti</span>')}
          <span class="n-row__price">${i.prix!=null?eur(i.prix):'—'}</span>
        </div>
      </div>`;
    document.getElementById('listeEnLigne').innerHTML = enLigne.length ? enLigne.map(i=>ligne(i,true)).join('') : '<div style="padding:22px;text-align:center;color:var(--n-ink-3);font-size:13px;">Aucun article en ligne pour le moment.</div>';
    document.getElementById('listeSortis').innerHTML = sortis.length ? sortis.map(i=>ligne(i,false)).join('') : '<div style="padding:18px;text-align:center;color:var(--n-ink-3);font-size:13px;">Rien pour l\'instant.</div>';
    chargerDemandes();
  } catch(e) {
    document.getElementById('listeEnLigne').innerHTML = `<div style="padding:22px;text-align:center;color:var(--n-bad);font-size:13px;">${esc(e.message)}</div>`;
  }
}
async function chargerDemandes(){
  try {
    const d = await api('/depot/mine/demandes');
    const lbl = { retrait:'📤 Retrait', vendu_ailleurs:'🤝 Vendu ailleurs', prix:'💶 Prix' };
    const st = { en_attente:'<span class="n-pill n-pill--accent">⏳ en attente</span>', approuvee:'<span class="n-pill n-pill--outline" style="color:var(--n-ok);border-color:var(--n-ok);">✓ faite</span>', refusee:'<span class="n-pill n-pill--outline" style="color:var(--n-bad);border-color:var(--n-bad);">refusée</span>' };
    document.getElementById('listeDemandes').innerHTML = d.rows.length ? d.rows.slice(0,30).map(r=>`
      <div class="n-row">
        <div class="n-row__main">
          <div class="n-row__title" style="font-size:12.5px;">${lbl[r.type]||esc(r.type)} — ${esc(r.product_title||'')}</div>
          <div class="n-row__sub">${esc(r.demande_le)}${r.type==='prix'?` · ${Number(r.current_price||0).toFixed(0)} € → ${Number(r.new_price||0).toFixed(0)} €`:''}${r.note?' · '+esc(r.note):''}</div>
        </div>
        <div class="n-row__side">${st[r.status]||esc(r.status)}</div>
      </div>`).join('') : '<div style="padding:18px;text-align:center;color:var(--n-ink-3);font-size:13px;">Aucune demande pour l\'instant.</div>';
  } catch(_){}
}

// Clic sur un article en ligne → panneau avec les trois actions (une demande à la fois).
function ouvrirPanneau(ev, pid){
  if (ev && ev.target && ev.target.closest('a')) return; // le lien « voir sur le site » garde son clic
  const i = ((donnees||{}).items||[]).find(x=>String(x.productId)===String(pid));
  if (!i) return;
  articleOuvert = i;
  const enCours = (i.demandes||[]).length;
  document.getElementById('feuille').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;">
      ${i.image?`<img class="n-row__thumb" src="${esc(i.image)}" style="width:56px;height:56px;" alt="">`:`<div class="n-row__thumb thumb-ph" style="width:56px;height:56px;">👕</div>`}
      <div style="min-width:0;">
        <div class="n-h3" style="font-size:15px;">${esc(i.titre)}</div>
        <div class="n-muted" style="font-size:12px;">${i.prix!=null?('affiché '+eur(i.prix)+' · '):''}${i.net!=null?('ton net : '+eur(i.net)):''}</div>
        ${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener" style="font-size:12px;color:inherit;">voir sur le site ↗</a>`:''}
      </div>
    </div>
    ${enCours
      ? `<div class="n-pill n-pill--accent" style="margin-bottom:8px;">⏳ Demande en cours : ${i.demandes.map(x=>x.type==='prix'?('prix '+x.newPrice+' €'):x.type.replace('_',' ')).join(' · ')}</div>
         <div class="n-muted" style="font-size:12.5px;">L'équipe Nestore doit d'abord la traiter avant une nouvelle demande.</div>`
      : `<div style="display:flex;flex-direction:column;gap:8px;">
          <button class="n-btn n-btn--primary" style="width:100%;" onclick="agir('retrait')">📤 Demander le retrait</button>
          <button class="n-btn n-btn--ghost" style="width:100%;" onclick="agir('vendu_ailleurs')">🤝 Vendu de mon côté</button>
          <button class="n-btn n-btn--ghost" style="width:100%;" onclick="agirPrix()">💶 Changer le prix</button>
        </div>`}
    <button class="n-btn n-btn--ghost n-btn--sm" style="width:100%;margin-top:12px;" onclick="fermerPanneau()">Fermer</button>`;
  document.getElementById('voile').classList.add('on');
}
function fermerPanneau(){ articleOuvert=null; const v=document.getElementById('voile'); if(v) v.classList.remove('on'); }
async function agir(type){
  const i = articleOuvert; if(!i) return;
  const msg = type==='retrait'
    ? `Demander le RETRAIT de « ${i.titre} » ?\n\nL'équipe valide, retire l'article du site et te le tient prêt en boutique.`
    : `Marquer « ${i.titre} » vendu de ton côté ?\n\nL'équipe valide et le retire du site.`;
  if(!confirm(msg)) return;
  await envoyerDemandes([{ productId: i.productId, type }]);
}
async function agirPrix(){
  const i = articleOuvert; if(!i) return;
  const c = (donnees && donnees.commission) || { prixMin: 25 };
  const v = prompt(`Nouveau prix affiché pour « ${i.titre} » (actuellement ${i.prix!=null?i.prix+' €':'—'}) —\nmultiple de 5, minimum ${c.prixMin} € :`);
  if(v===null) return;
  const p = Number(String(v).replace(',','.'));
  if(!Number.isFinite(p) || p < c.prixMin || p % 5 !== 0){ alert(`Prix invalide — multiple de 5 €, minimum ${c.prixMin} €. Exemple : 35, 120, 235…`); return; }
  const net = Math.round((p*0.7-15)*100)/100;
  if(!confirm(`Prix demandé : ${p} € (tu toucheras ${net.toFixed(2)} € à la vente).\nAppliqué après validation par l'équipe — envoyer ?`)) return;
  await envoyerDemandes([{ productId: i.productId, type:'prix', newPrice: p }]);
}
async function envoyerDemandes(demandes){
  try {
    const d = await api('/depot/mine/demandes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ demandes }) });
    let msg = `✓ ${d.crees} demande(s) envoyée(s) — l'équipe Nestore va les traiter.`;
    if (d.refus && d.refus.length) msg += `\n${d.refus.length} refusée(s) : ${d.refus.map(r=>r.raison).join(' · ')}`;
    alert(msg);
    chargerTout();
  } catch(e){ alert('Échec : ' + e.message); }
}

// Reprise de session : le jeton stocké est validé par /auth/me (et l'espace exige un depot_tag).
(async function(){
  if (!jeton) return;
  try {
    const d = await api('/auth/me');
    if (d.user && d.user.depot_tag) { document.getElementById('pillNom').textContent = d.user.name; montrerEspace(); }
    else seDeconnecter();
  } catch(_){}
})();
</script>
</body>
</html>
